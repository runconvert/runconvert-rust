name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "59 3 * * 1" # weekly, Monday 03:xx UTC (live tests cost about 2 credits)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --test unit

  live:
    name: Live API
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Waits for approval from a required reviewer of the "live" environment (it spends credits).
    environment: live
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: cargo test --test live -- --nocapture
        env:
          RUNCONVERT_API_KEY: ${{ secrets.RUNCONVERT_API_KEY }}
