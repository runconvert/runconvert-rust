# Publishes to crates.io when a version tag is pushed:
#   1. bump "version" in Cargo.toml and CHANGELOG.md, merge to main
#   2. gh release create v0.2.0 --target main   (or: git tag v0.2.0 && git push origin v0.2.0)
#   3. approve the "release" environment in the Actions tab
# Uses crates.io trusted publishing (OIDC): no crates.io token is stored anywhere.
name: Release

on:
  push:
    tags: ["v*"]
  # Started by release-please (release-please.yml) on the new tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: cargo test --test unit
      - name: The tag matches Cargo.toml
        run: test "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" = "$GITHUB_REF_NAME"
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
