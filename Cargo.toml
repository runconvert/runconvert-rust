[package]
name = "runconvert"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Official RunConvert SDK for Rust: convert files between 240+ formats"
license = "MIT"
homepage = "https://www.runconvert.com/docs"
repository = "https://github.com/runconvert/runconvert-rust"
keywords = ["runconvert", "convert", "file-converter", "pdf", "api"]
categories = ["api-bindings", "multimedia"]
readme = "README.md"
# Not published until launch.
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time"] }
wiremock = "0.6"
tempfile = "3"
